[project]
name = "mutator"
version = "0.1.0"
description = "Mutation testing for Clojure, Java, Kotlin, Go, TypeScript, Rust, and Python, in the snapshot uml-viewer reads."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: Zero-Clause BSD (0BSD)"]
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.24",
    "tree-sitter-language-pack>=0.7",
]

[project.scripts]
mutator = "mutator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
